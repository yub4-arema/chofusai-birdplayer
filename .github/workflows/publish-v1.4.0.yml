name: Publish v1.4.0 package

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-v1.4.0
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.4.0
      - name: Build and verify the distribution
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, zipfile
          root = Path('.')
          output = Path('chofusai-birdplayer-v1.4.0-jev-guided.zip')
          files = sorted((root / 'extension').glob('*')) + [root / 'README.md', root / 'LICENSE', root / 'docs/realtime-benchmark.md']
          assert json.loads((root / 'extension/manifest.json').read_text())['version'] == '1.4.0'
          with zipfile.ZipFile(output, 'w', zipfile.ZIP_DEFLATED) as archive:
              for file in files:
                  if file.is_file():
                      archive.write(file, file.as_posix())
          with zipfile.ZipFile(output) as archive:
              assert archive.testzip() is None
              for name in archive.namelist():
                  assert archive.read(name) == Path(name).read_bytes()
          digest = hashlib.sha256(output.read_bytes()).hexdigest()
          output.with_suffix('.zip.sha256').write_text(digest + '  ' + output.name + '\n')
          PY
      - name: Attach the package and publish the prepared release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v1.4.0 chofusai-birdplayer-v1.4.0-jev-guided.zip chofusai-birdplayer-v1.4.0-jev-guided.zip.sha256 --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit v1.4.0 --draft=false --latest --repo "$GITHUB_REPOSITORY"
