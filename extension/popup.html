<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>調布祭 Flappy × Jev</title><link rel="stylesheet" href="popup.css"></head>
<body>
  <main>
    <p class="eyebrow">TYPE SAFE DECISIONS / FLAPPY</p>
    <h1>調布祭 Flappy × Jev</h1>
    <p class="intro">接続先とモデルを変えて、どこまで続くか試せます。</p>
    <form id="settings">
      <label for="mode">プレイ方法</label>
      <select id="mode"><option value="jev-plan">Jevが固定のクリック予定を選択（実験）</option><option value="jev">Jevがクリック／待機を判断（従来方式）</option><option value="local">ローカルテスト（API未使用）</option></select>
      <label for="endpoint">接続先URL</label>
      <input id="endpoint" type="url" value="https://api.typesafe.ai/v1/systemone" list="endpoints" spellcheck="false" required maxlength="2048">
      <datalist id="endpoints">
        <option value="https://api.typesafe.ai/v1/systemone" label="TypeSafe"></option>
        <option value="http://127.0.0.1:8009/v1/systemone" label="Kev"></option>
        <option value="http://127.0.0.1:8000/v1/systemone" label="Laya"></option>
        <option value="http://127.0.0.1:8080/v1/systemone" label="LocalJev"></option>
      </datalist>
      <label for="apiKey">APIキー（不要なサーバーは空欄）</label>
      <input id="apiKey" type="password" autocomplete="off" spellcheck="false" placeholder="キーを入力">
      <small id="keyStatus">キーは接続先ごとにChrome内へ保存します。</small>
      <label for="model">モデルID</label>
      <input id="model" value="jev-latest" list="models" spellcheck="false" required maxlength="200">
      <datalist id="models"><option value="jev-latest"></option><option value="jev-preview"></option><option value="kev-latest"></option><option value="english"></option><option value="multilingual"></option><option value="typed-decisions"></option></datalist>
      <label for="limit">1回の開始でのAPI呼び出し上限</label>
      <input id="limit" type="number" min="1" max="1000" step="1" value="200" required>
      <label class="check"><input id="autoRestart" type="checkbox">ゲーム終了後、自動で再挑戦する</label>
      <button class="secondary" type="submit">設定を保存</button>
    </form>
    <div class="actions"><button id="start" type="button">保存して開始</button><button id="stop" class="secondary" type="button">停止</button></div>
    <p id="status" role="status" aria-live="polite">設定を読み込んでいます…</p>
    <div class="links"><a href="https://www.chofusai.jp/map/" target="_blank" rel="noopener">ゲームを開く ↗</a><a href="https://console.typesafe.ai/" target="_blank" rel="noopener">APIキーを取得 ↗</a></div>
    <p class="note">ゲームの数値状態を選んだ接続先に送信します。キーは接続先ごとに保存し、切り替えても残ります。ローカルモデルのサーバーは別途起動してください。</p>
    <button id="clearKey" type="button" class="text-button">この接続先の保存済みキーを削除</button>
  </main>
  <script src="core.js"></script><script src="popup.js"></script>
</body>
</html>
